name: Profile Visuals

# 개인 GitHub 통계·언어 카드를 만들어 output 브랜치에 올린다.
on:
  schedule:
    - cron: "40 15 * * *" # 매일 KST 00:40
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Metrics — overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Seoul
          output_action: none
          filename: metrics-stats.svg

      - name: Metrics — languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          output_action: none
          filename: metrics-languages.svg

      - name: Collect
        run: |
          # metrics 액션이 결과를 root 소유로 남기므로 복사·소유권 정리는 sudo 로 한다
          sudo mkdir -p dist
          sudo cp /metrics_renders/*.svg dist/
          sudo chown -R "$(id -u):$(id -g)" dist
          # 무한 루프 애니메이션이 프로필 화면을 계속 다시 그려 렉을 만든다 — 15초쯤 돌고 멈추게
          python3 -I scripts/profile_assets/settle.py dist/*.svg
          ls -la dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: profile visuals"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
